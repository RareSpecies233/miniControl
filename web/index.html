<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniRemote</title>
<style>
:root {
  --bg-primary: #0b0e14;
  --bg-secondary: #131720;
  --bg-tertiary: #1a1f2e;
  --bg-elevated: #1e2436;
  --border: #2a3044;
  --border-focus: #3d4663;
  --text-primary: #e1e4eb;
  --text-secondary: #8b92a8;
  --text-muted: #5c6380;
  --accent: #6c8cff;
  --accent-hover: #8ba4ff;
  --accent-dim: rgba(108,140,255,0.12);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.12);
  --red: #f87171;
  --radius: 8px;
  --radius-sm: 5px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}
.header .logo {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header .logo svg { width: 18px; height: 18px; }
.header .logo span {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--text-primary);
}
.header .sep {
  width: 1px;
  height: 18px;
  background: var(--border);
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  transition: all 0.2s;
}
.status-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.2s;
}
.status-badge.connected { color: var(--green); border-color: rgba(74,222,128,0.2); background: var(--green-dim); }
.status-badge.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
.header-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.header-stats .stat { display: flex; align-items: center; gap: 4px; }
.header-stats .stat b { color: var(--text-secondary); font-weight: 500; }

/* Canvas */
#canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
  position: relative;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  cursor: crosshair;
}

/* Controls */
.controls {
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.ctrl {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  height: 30px;
  font-size: 11px;
}
.ctrl + .ctrl { border-left: 1px solid var(--border); }
.ctrl label {
  color: var(--text-muted);
  white-space: nowrap;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-size: 10px;
}
.ctrl input[type=range] {
  -webkit-appearance: none;
  width: 90px;
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  outline: none;
}
.ctrl input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg-secondary);
  box-shadow: 0 0 0 1px var(--accent);
  transition: transform 0.15s;
}
.ctrl input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
.ctrl input[type=range]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  border: 2px solid var(--bg-secondary);
}
.ctrl .val {
  color: var(--accent);
  min-width: 28px;
  text-align: right;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.ctrl select, .ctrl input[type=number] {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.ctrl select:focus, .ctrl input[type=number]:focus { border-color: var(--accent); }
.ctrl select { cursor: pointer; }
.ctrl input[type=number] {
  width: 52px;
  -moz-appearance: textfield;
}
.ctrl input[type=number]::-webkit-outer-spin-button,
.ctrl input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.ctrl .x-sep { color: var(--text-muted); font-size: 10px; margin: 0 2px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.15s;
  height: 26px;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-elevated); border-color: var(--border-focus); color: var(--text-primary); }
.btn:active { transform: scale(0.97); }
.btn.accent { background: var(--accent-dim); border-color: rgba(108,140,255,0.25); color: var(--accent); }
.btn.accent:hover { background: rgba(108,140,255,0.2); }
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    <span>MiniRemote</span>
  </div>
  <div class="sep"></div>
  <div id="status" class="status-badge"><span class="dot"></span>Connecting</div>
  <div class="header-stats">
    <div class="stat"><b id="fps">0</b> fps</div>
    <div class="stat" id="resolution-info">-</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="screen"></canvas>
</div>

<div class="controls">
  <div class="ctrl">
    <label>Quality</label>
    <input type="range" id="quality" min="10" max="100" value="70">
    <span class="val" id="quality-val">70</span>
  </div>
  <div class="ctrl">
    <label>Resolution</label>
    <select id="resolution">
      <option value="0x0">Native</option>
      <option value="3840x2160">3840 x 2160 (4K)</option>
      <option value="2560x1440">2560 x 1440 (2K)</option>
      <option value="1920x1080" selected>1920 x 1080 (FHD)</option>
      <option value="1600x900">1600 x 900</option>
      <option value="1280x720">1280 x 720 (HD)</option>
      <option value="1024x768">1024 x 768</option>
      <option value="800x600">800 x 600</option>
      <option value="640x480">640 x 480</option>
    </select>
    <span class="x-sep">or</span>
    <input type="number" id="custom-w" placeholder="W" min="64" max="7680" step="1">
    <span class="x-sep">x</span>
    <input type="number" id="custom-h" placeholder="H" min="64" max="4320" step="1">
    <button class="btn" id="apply-custom">Apply</button>
  </div>
  <div class="ctrl" style="margin-left:auto;">
    <button class="btn" id="refresh-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
    <button class="btn accent" id="fullscreen-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      Fullscreen
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const fpsEl = document.getElementById('fps');
const qualitySlider = document.getElementById('quality');
const qualityVal = document.getElementById('quality-val');
const resolutionSel = document.getElementById('resolution');
const customW = document.getElementById('custom-w');
const customH = document.getElementById('custom-h');
const applyCustom = document.getElementById('apply-custom');
const refreshBtn = document.getElementById('refresh-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const resInfo = document.getElementById('resolution-info');

let frameCount = 0;
let lastFpsTime = Date.now();
let screenW = 0, screenH = 0;
let polling = false;

// --- Mouse coordinate mapping (accounts for object-fit: contain letterboxing) ---
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const cw = canvas.width, ch = canvas.height;
  const ew = rect.width, eh = rect.height;
  const scale = Math.min(ew / cw, eh / ch);
  const dw = cw * scale, dh = ch * scale;
  const ox = (ew - dw) / 2, oy = (eh - dh) / 2;
  const ix = e.clientX - rect.left - ox;
  const iy = e.clientY - rect.top - oy;
  return {
    x: Math.round(ix / scale),
    y: Math.round(iy / scale)
  };
}

async function sendInput(data) {
  try {
    await fetch('/api/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (e) {}
}

async function pollFrame() {
  while (polling) {
    try {
      const res = await fetch('/api/screenshot');
      if (res.ok) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const img = new Image();
        await new Promise(r => { img.onload = r; img.onerror = r; img.src = url; });
        if (img.complete && img.naturalWidth > 0) {
          if (img.width !== canvas.width || img.height !== canvas.height) {
            canvas.width = img.width;
            canvas.height = img.height;
            screenW = img.width;
            screenH = img.height;
            resInfo.textContent = screenW + 'x' + screenH;
          }
          ctx.drawImage(img, 0, 0);
          statusEl.textContent = 'Connected';
          statusEl.className = 'status-badge connected';
          frameCount++;
        }
        URL.revokeObjectURL(url);
      }
    } catch (e) {
      statusEl.textContent = 'Connecting';
      statusEl.className = 'status-badge';
    }
    await new Promise(r => setTimeout(r, 180));
  }
}

setInterval(() => {
  const now = Date.now();
  const elapsed = (now - lastFpsTime) / 1000;
  if (elapsed >= 1) {
    fpsEl.textContent = Math.round(frameCount / elapsed);
    frameCount = 0;
    lastFpsTime = now;
  }
}, 500);

// --- Mouse events ---
canvas.addEventListener('mousemove', (e) => {
  const { x, y } = getCanvasCoords(e);
  sendInput({ type: 'mouse_move', x, y });
});

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  canvas.focus();
  const btn = e.button === 0 ? 'left' : e.button === 2 ? 'right' : 'middle';
  const { x, y } = getCanvasCoords(e);
  sendInput({ type: 'mouse_button', button: btn, pressed: true, x, y });
});

canvas.addEventListener('mouseup', (e) => {
  e.preventDefault();
  const btn = e.button === 0 ? 'left' : e.button === 2 ? 'right' : 'middle';
  const { x, y } = getCanvasCoords(e);
  sendInput({ type: 'mouse_button', button: btn, pressed: false, x, y });
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  sendInput({ type: 'mouse_scroll', dx: e.deltaX || 0, dy: e.deltaY || 0 });
}, { passive: false });

// --- Keyboard events ---
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  e.preventDefault();
  sendInput({ type: 'key', key: e.key, code: e.code, pressed: true });
});

document.addEventListener('keyup', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  e.preventDefault();
  sendInput({ type: 'key', key: e.key, code: e.code, pressed: false });
});

// --- Controls ---
qualitySlider.addEventListener('input', () => {
  qualityVal.textContent = qualitySlider.value;
});

qualitySlider.addEventListener('change', () => {
  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ quality: parseInt(qualitySlider.value) })
  });
});

function applyResolution(w, h) {
  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ width: w, height: h })
  });
}

resolutionSel.addEventListener('change', () => {
  const [w, h] = resolutionSel.value.split('x').map(Number);
  applyResolution(w, h);
  customW.value = w || '';
  customH.value = h || '';
});

applyCustom.addEventListener('click', () => {
  const w = parseInt(customW.value) || 0;
  const h = parseInt(customH.value) || 0;
  if (w > 0 && h > 0) {
    applyResolution(w, h);
    // Sync dropdown if matching preset
    const opt = resolutionSel.querySelector(`option[value="${w}x${h}"]`);
    if (opt) resolutionSel.value = `${w}x${h}`;
    else resolutionSel.value = '0x0';
  }
});

refreshBtn.addEventListener('click', () => {
  fetch('/api/refresh', { method: 'POST' });
  refreshBtn.style.pointerEvents = 'none';
  refreshBtn.style.opacity = '0.5';
  setTimeout(() => { refreshBtn.style.pointerEvents = ''; refreshBtn.style.opacity = ''; }, 400);
});

fullscreenBtn.addEventListener('click', () => {
  const wrap = document.getElementById('canvas-wrap');
  if (!document.fullscreenElement) {
    wrap.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  const label = fullscreenBtn.querySelector('svg').nextSibling;
  if (document.fullscreenElement) {
    fullscreenBtn.childNodes[1].textContent = ' Exit FS ';
  } else {
    fullscreenBtn.childNodes[1].textContent = ' Fullscreen ';
  }
});

// --- Init ---
fetch('/api/config').then(r => r.json()).then(cfg => {
  qualitySlider.value = cfg.quality;
  qualityVal.textContent = cfg.quality;
  screenW = cfg.screen_width;
  screenH = cfg.screen_height;
  resInfo.textContent = screenW + 'x' + screenH;
});

canvas.tabIndex = 0;
canvas.focus();
polling = true;
pollFrame();
</script>
</body>
</html>
