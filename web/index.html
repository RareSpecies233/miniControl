<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniRemote - Remote Desktop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#header { background: #16213e; padding: 8px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
#header h1 { font-size: 14px; font-weight: 600; color: #e94560; }
.status { font-size: 12px; color: #aaa; }
.status.connected { color: #4ecca3; }
#canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
#controls { background: #16213e; padding: 8px 16px; display: flex; align-items: center; gap: 20px; border-top: 1px solid #0f3460; flex-shrink: 0; flex-wrap: wrap; }
.ctrl-group { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.ctrl-group label { color: #aaa; white-space: nowrap; }
.ctrl-group input[type=range] { width: 100px; accent-color: #e94560; }
.ctrl-group select { background: #0f3460; color: #eee; border: 1px solid #333; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
.ctrl-group span { color: #4ecca3; min-width: 36px; }
button { background: #0f3460; color: #eee; border: 1px solid #333; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; transition: background 0.2s; }
button:hover { background: #e94560; border-color: #e94560; }
#fps { color: #4ecca3; font-size: 12px; font-variant-numeric: tabular-nums; }
#resolution-info { color: #aaa; font-size: 11px; }
</style>
</head>
<body>
<div id="header">
    <h1>MiniRemote</h1>
    <span id="status" class="status">Connecting...</span>
    <span id="fps">0 fps</span>
    <span id="resolution-info"></span>
</div>
<div id="canvas-wrap">
    <canvas id="screen"></canvas>
</div>
<div id="controls">
    <div class="ctrl-group">
        <label>Quality:</label>
        <input type="range" id="quality" min="10" max="100" value="70">
        <span id="quality-val">70</span>
    </div>
    <div class="ctrl-group">
        <label>Resolution:</label>
        <select id="resolution">
            <option value="0x0">Original</option>
            <option value="1920x1080">1920x1080</option>
            <option value="1280x720">1280x720</option>
            <option value="1024x768">1024x768</option>
            <option value="640x480">640x480</option>
        </select>
    </div>
    <div class="ctrl-group">
        <button id="refresh-btn">Force Refresh</button>
    </div>
    <div class="ctrl-group">
        <button id="fullscreen-btn">Fullscreen</button>
    </div>
</div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const fpsEl = document.getElementById('fps');
const qualitySlider = document.getElementById('quality');
const qualityVal = document.getElementById('quality-val');
const resolutionSel = document.getElementById('resolution');
const refreshBtn = document.getElementById('refresh-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const resInfo = document.getElementById('resolution-info');

let frameCount = 0;
let lastFpsTime = Date.now();
let screenW = 0, screenH = 0;
let polling = false;

async function sendInput(data) {
    try {
        await fetch('/api/input', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
    } catch (e) {}
}

async function pollFrame() {
    while (polling) {
        try {
            const res = await fetch('/api/screenshot');
            if (res.ok) {
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const img = new Image();
                await new Promise((resolve) => {
                    img.onload = resolve;
                    img.onerror = resolve;
                    img.src = url;
                });
                if (img.complete && img.naturalWidth > 0) {
                    if (img.width !== canvas.width || img.height !== canvas.height) {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        screenW = img.width;
                        screenH = img.height;
                        resInfo.textContent = screenW + 'x' + screenH;
                    }
                    ctx.drawImage(img, 0, 0);
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'status connected';
                    frameCount++;
                }
                URL.revokeObjectURL(url);
            }
        } catch (e) {
            statusEl.textContent = 'Connecting...';
            statusEl.className = 'status';
        }
        await new Promise(r => setTimeout(r, 180));
    }
}

setInterval(() => {
    const now = Date.now();
    const elapsed = (now - lastFpsTime) / 1000;
    if (elapsed >= 1) {
        fpsEl.textContent = Math.round(frameCount / elapsed) + ' fps';
        frameCount = 0;
        lastFpsTime = now;
    }
}, 500);

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = screenW / rect.width;
    const scaleY = screenH / rect.height;
    const x = Math.round((e.clientX - rect.left) * scaleX);
    const y = Math.round((e.clientY - rect.top) * scaleY);
    sendInput({ type: 'mouse_move', x, y });
});

canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const btn = e.button === 0 ? 'left' : e.button === 2 ? 'right' : 'middle';
    sendInput({ type: 'mouse_button', button: btn, pressed: true });
});

canvas.addEventListener('mouseup', (e) => {
    e.preventDefault();
    const btn = e.button === 0 ? 'left' : e.button === 2 ? 'right' : 'middle';
    sendInput({ type: 'mouse_button', button: btn, pressed: false });
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    sendInput({ type: 'mouse_scroll', dx: e.deltaX || 0, dy: e.deltaY || 0 });
}, { passive: false });

document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    e.preventDefault();
    sendInput({ type: 'key', key: e.key, code: e.code, pressed: true });
});

document.addEventListener('keyup', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    e.preventDefault();
    sendInput({ type: 'key', key: e.key, code: e.code, pressed: false });
});

qualitySlider.addEventListener('input', () => {
    qualityVal.textContent = qualitySlider.value;
});

qualitySlider.addEventListener('change', () => {
    fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quality: parseInt(qualitySlider.value) })
    });
});

resolutionSel.addEventListener('change', () => {
    const [w, h] = resolutionSel.value.split('x').map(Number);
    fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ width: w, height: h })
    });
});

refreshBtn.addEventListener('click', () => {
    fetch('/api/refresh', { method: 'POST' });
    refreshBtn.textContent = 'Refreshing...';
    setTimeout(() => { refreshBtn.textContent = 'Force Refresh'; }, 500);
});

fullscreenBtn.addEventListener('click', () => {
    const wrap = document.getElementById('canvas-wrap');
    if (!document.fullscreenElement) {
        wrap.requestFullscreen().catch(() => {});
        fullscreenBtn.textContent = 'Exit Fullscreen';
    } else {
        document.exitFullscreen();
        fullscreenBtn.textContent = 'Fullscreen';
    }
});

document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
});

// Load initial config
fetch('/api/config').then(r => r.json()).then(cfg => {
    qualitySlider.value = cfg.quality;
    qualityVal.textContent = cfg.quality;
    screenW = cfg.screen_width;
    screenH = cfg.screen_height;
    resInfo.textContent = screenW + 'x' + screenH;
});

canvas.tabIndex = 0;
canvas.focus();

polling = true;
pollFrame();
</script>
</body>
</html>
